# API models (set GROQ_API_KEY / OPENROUTER_API_KEY in .env). Covers E1, E2, E3, the main
# Gap 1/2 comparisons and E5. Groq free tier: ~200k tokens/day per model, so this takes
# several days; the run resumes where it stopped.
run_name: phase2-api
split: test
temperature: 0.7
max_steps: 8
concurrency: 1        # free-tier rate limits; the provider backs off on HTTP 429
episode_timeout: 900
retries: 3
models:
  - groq:openai/gpt-oss-20b
  - groq:openai/gpt-oss-120b
  - groq:qwen/qwen3.8-27b
seeds: [0, 1, 2]
defenses: [none, safety_prompt, llm_guard, allowlist+scoped, full]
