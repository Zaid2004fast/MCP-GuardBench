# Second local open-weight model (one seed) for the main comparisons, so claims do
# not rest on a single model. Same run folder as the primary model.
run_name: phase2-local
split: test
temperature: 0.7      # sampled decoding so seeds differ; the MCIP-style guard always decodes greedily
max_steps: 8
concurrency: 2
episode_timeout: 900
retries: 2
models: [ollama:llama3.2:3b]
seeds: [0]
defenses: [none, safety_prompt, llm_guard, full]   # B0, B1, B2 and the proposed system
