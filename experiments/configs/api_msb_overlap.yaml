# Models that overlap with MSB's evaluation (Llama-3.1-8B, Llama-3.3-70B) via OpenRouter,
# for the direct comparison with the base paper (E2).
run_name: phase2-api
split: test
temperature: 0.7
max_steps: 8
concurrency: 1        # free-tier rate limits; the provider backs off on HTTP 429
episode_timeout: 900
retries: 3
models:
  - openrouter:meta-llama/llama-3.1-8b-instruct
  - openrouter:meta-llama/llama-3.3-70b-instruct
seeds: [0, 1, 2]
defenses: [none, llm_guard, allowlist+scoped, full]
