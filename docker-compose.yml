# Benchmark + local Ollama in one command:
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen2.5:3b
#   docker compose run --rm bench python -m mcpguard.eval.run --config experiments/configs/smoke_local.yaml
services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes: [ollama:/root/.ollama]
  bench:
    build: .
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    env_file:
      - path: .env
        required: false
    volumes: ["./results:/app/results"]
volumes:
  ollama: {}
