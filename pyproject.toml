[project]
name = "mcpguardbench"
version = "0.1.0"
description = "Sandboxed attack/defense benchmark for Model Context Protocol (MCP) tool access"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.12,<2", "httpx>=0.27", "pydantic>=2.7", "PyYAML>=6.0",
  "pandas>=2.2", "tabulate>=0.9", "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["mcpguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
